AWSTemplateFormatVersion: '2010-09-09'
Description: RDS PostgreSQL privado para Semi-Social G15 (PRO-2)

Parameters:
  DbSubnetGroupName:
    Type: String
    Default: semisocial-g15-db-subnets
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-09d4e1d7eba6da751
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: Clase única permitida para mantener el despliegue dentro del plan académico/gratuito.
    AllowedValues:
      - db.t4g.micro
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 20
    Description: Almacenamiento fijo de 20 GiB para no habilitar crecimiento facturable.
  MasterPasswordParameterName:
    Type: String
    Default: /semi-social/prod/rds/master-password
    Description: Nombre del SecureString Standard creado fuera de Git.

Resources:
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: semisocial-g15-postgres
      DBName: semisocial
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: gp2
      StorageEncrypted: true
      MasterUsername: semisocial_admin
      MasterUserPassword: !Sub '{{resolve:ssm-secure:${MasterPasswordParameterName}}}'
      Port: 5432
      DBSubnetGroupName: !Ref DbSubnetGroupName
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      PreferredBackupWindow: 08:00-08:30
      PreferredMaintenanceWindow: sun:09:00-sun:09:30
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      EnableIAMDatabaseAuthentication: false
      CopyTagsToSnapshot: true
      EnablePerformanceInsights: false
      Tags:
        - Key: Project
          Value: Semi-Social
        - Key: Group
          Value: G15
        - Key: Ticket
          Value: PRO-2

Outputs:
  DbInstanceIdentifier:
    Value: !Ref Database
  DbEndpointAddress:
    Value: !GetAtt Database.Endpoint.Address
  DbEndpointPort:
    Value: !GetAtt Database.Endpoint.Port
