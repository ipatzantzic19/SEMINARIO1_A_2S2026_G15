openapi: 3.0.3
info:
  title: TaskFlow + CloudDrive API
  version: 1.0.0
  description: >-
    Contrato común para Node.js y Python. Los binarios se cargan mediante los
    servicios serverless de cada nube; este contrato registra y consulta metadatos.
servers:
  - url: /
    description: Mismo host que sirve la especificación
tags:
  - name: Salud
  - name: Autenticación
  - name: Tareas
  - name: Archivos
paths:
  /health:
    get:
      tags: [Salud]
      summary: Verificar disponibilidad
      operationId: consultarSalud
      security: []
      responses:
        '200':
          description: Servidor disponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaSalud' }
        '429': { $ref: '#/components/responses/DemasiadasSolicitudes' }
  /api/v1/auth/register:
    post:
      tags: [Autenticación]
      summary: Registrar usuario
      operationId: registrarUsuario
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudRegistro' }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaUsuario' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      operationId: iniciarSesion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudInicioSesion' }
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaInicioSesion' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
  /api/v1/tasks:
    get:
      tags: [Tareas]
      summary: Listar tareas del usuario autenticado
      operationId: listarTareas
      security: [{ autenticacionBearer: [] }]
      responses:
        '200':
          description: Tareas del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaTareas' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '500': { $ref: '#/components/responses/ErrorInterno' }
    post:
      tags: [Tareas]
      summary: Crear tarea
      operationId: crearTarea
      security: [{ autenticacionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudTarea' }
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaTarea' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/v1/tasks/{taskId}:
    parameters:
      - { $ref: '#/components/parameters/TaskId' }
    get:
      tags: [Tareas]
      summary: Consultar una tarea propia
      operationId: consultarTarea
      security: [{ autenticacionBearer: [] }]
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaTarea' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Tareas]
      summary: Editar título y descripción
      operationId: actualizarTarea
      security: [{ autenticacionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudTarea' }
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaTarea' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Tareas]
      summary: Marcar tarea como completada o pendiente
      operationId: cambiarEstadoTarea
      security: [{ autenticacionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completada]
              properties:
                completada: { type: boolean }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaTarea' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Tareas]
      summary: Eliminar tarea propia
      operationId: eliminarTarea
      security: [{ autenticacionBearer: [] }]
      responses:
        '204': { description: Tarea eliminada }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /api/v1/files:
    get:
      tags: [Archivos]
      summary: Listar metadatos de archivos propios
      operationId: listarArchivos
      security: [{ autenticacionBearer: [] }]
      responses:
        '200':
          description: Archivos del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaArchivos' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
    post:
      tags: [Archivos]
      summary: Registrar metadatos de un objeto ya cargado
      operationId: registrarArchivo
      security: [{ autenticacionBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitudArchivo' }
      responses:
        '201':
          description: Metadatos registrados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaArchivo' }
        '400': { $ref: '#/components/responses/SolicitudIncorrecta' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /api/v1/files/{fileId}:
    parameters:
      - { $ref: '#/components/parameters/FileId' }
    get:
      tags: [Archivos]
      summary: Consultar metadatos de un archivo propio
      operationId: consultarArchivo
      security: [{ autenticacionBearer: [] }]
      responses:
        '200':
          description: Archivo encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaArchivo' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Archivos]
      summary: Eliminar metadatos de un archivo propio
      operationId: eliminarArchivo
      security: [{ autenticacionBearer: [] }]
      responses:
        '204': { description: Metadatos eliminados }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
components:
  securitySchemes:
    autenticacionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    FileId:
      name: fileId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
  responses:
    SolicitudIncorrecta:
      description: Datos inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
    NoAutorizado:
      description: Credenciales o token inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
    NoEncontrado:
      description: Recurso no encontrado o no pertenece al usuario
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
    Conflicto:
      description: El nombre de usuario o correo ya existe
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
    DemasiadasSolicitudes:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
    ErrorInterno:
      description: Error inesperado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RespuestaError' }
  schemas:
    SolicitudRegistro:
      type: object
      additionalProperties: false
      required: [nombreUsuario, correoElectronico, contrasena, confirmacionContrasena]
      properties:
        nombreUsuario: { type: string, minLength: 3, maxLength: 50, pattern: '^[a-z0-9_]+$' }
        correoElectronico: { type: string, format: email, maxLength: 254 }
        contrasena: { type: string, format: password, minLength: 8, maxLength: 72 }
        confirmacionContrasena: { type: string, format: password, minLength: 8, maxLength: 72 }
        urlImagenPerfil:
          type: string
          format: uri
          description: URL HTTPS obtenida del flujo de carga serverless.
    SolicitudInicioSesion:
      type: object
      additionalProperties: false
      required: [nombreUsuario, contrasena]
      properties:
        nombreUsuario: { type: string }
        contrasena: { type: string, format: password }
    SolicitudTarea:
      type: object
      additionalProperties: false
      required: [titulo]
      properties:
        titulo: { type: string, minLength: 1, maxLength: 200 }
        descripcion: { type: string, default: '' }
        fechaCreacion:
          type: string
          format: date-time
          description: Opcional; el backend usa la hora actual si se omite.
    SolicitudArchivo:
      type: object
      additionalProperties: false
      required: [nombreOriginal, tipoMime, tamanoBytes, proveedorAlmacenamiento, claveObjeto, urlObjeto]
      properties:
        nombreOriginal: { type: string, maxLength: 255 }
        tipoMime: { type: string, maxLength: 255 }
        tamanoBytes: { type: integer, format: int64, minimum: 0 }
        proveedorAlmacenamiento: { type: string, enum: [S3, BLOB] }
        claveObjeto: { type: string }
        urlObjeto: { type: string, format: uri, pattern: '^https://' }
    Usuario:
      type: object
      required: [id, nombreUsuario, correoElectronico]
      properties:
        id: { type: integer, format: int64 }
        nombreUsuario: { type: string }
        correoElectronico: { type: string, format: email }
        urlImagenPerfil: { type: string, format: uri, nullable: true }
    Tarea:
      type: object
      required: [id, usuarioId, titulo, descripcion, fechaCreacion, completada]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: integer, format: int64 }
        titulo: { type: string }
        descripcion: { type: string }
        fechaCreacion: { type: string, format: date-time }
        completada: { type: boolean }
        fechaCompletada: { type: string, format: date-time, nullable: true }
        actualizadoEn: { type: string, format: date-time }
    Archivo:
      type: object
      required: [id, usuarioId, nombreOriginal, tipoMime, tamanoBytes, proveedorAlmacenamiento, claveObjeto, urlObjeto, creadoEn]
      properties:
        id: { type: integer, format: int64 }
        usuarioId: { type: integer, format: int64 }
        nombreOriginal: { type: string }
        tipoMime: { type: string }
        tamanoBytes: { type: integer, format: int64 }
        proveedorAlmacenamiento: { type: string, enum: [S3, BLOB] }
        claveObjeto: { type: string }
        urlObjeto: { type: string, format: uri }
        creadoEn: { type: string, format: date-time }
    RespuestaSalud:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [estado, servicio, implementacion]
          properties:
            estado: { type: string, enum: [ok] }
            servicio: { type: string, enum: [taskflow-api] }
            implementacion: { type: string, enum: [node, python] }
    RespuestaUsuario:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [usuario]
          properties:
            usuario: { $ref: '#/components/schemas/Usuario' }
    RespuestaInicioSesion:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [token, tipoToken, expiraEn, usuario]
          properties:
            token: { type: string }
            tipoToken: { type: string, enum: [Bearer] }
            expiraEn: { type: integer, example: 3600 }
            usuario: { $ref: '#/components/schemas/Usuario' }
    RespuestaTarea:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [tarea]
          properties:
            tarea: { $ref: '#/components/schemas/Tarea' }
    RespuestaTareas:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [tareas, total]
          properties:
            tareas: { type: array, items: { $ref: '#/components/schemas/Tarea' } }
            total: { type: integer, minimum: 0 }
    RespuestaArchivo:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [archivo]
          properties:
            archivo: { $ref: '#/components/schemas/Archivo' }
    RespuestaArchivos:
      type: object
      required: [exito, datos]
      properties:
        exito: { type: boolean, enum: [true] }
        datos:
          type: object
          required: [archivos, total]
          properties:
            archivos: { type: array, items: { $ref: '#/components/schemas/Archivo' } }
            total: { type: integer, minimum: 0 }
    DetalleError:
      type: object
      required: [mensaje]
      properties:
        campo: { type: string }
        mensaje: { type: string }
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: ERROR_VALIDACION }
        mensaje: { type: string }
        detalles: { type: array, items: { $ref: '#/components/schemas/DetalleError' } }
    RespuestaError:
      type: object
      required: [exito, error]
      properties:
        exito: { type: boolean, enum: [false] }
        error: { $ref: '#/components/schemas/Error' }
