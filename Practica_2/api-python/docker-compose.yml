# SOLO DESARROLLO LOCAL. Este PostgreSQL NO es Amazon RDS y no forma parte de
# la infraestructura de la práctica. Sirve para desarrollar y ejecutar las
# pruebas de integración sin depender del RDS privado.
#
#   docker compose up -d
#   Variables locales: DB_HOST=localhost DB_PORT=5433 DB_USER=taskflow_dev
#                      DB_PASSWORD=taskflow_dev DB_SSLMODE=disable
#
# Imagen 16 porque database/schema.sql declara PostgreSQL 16 como motor objetivo.
# Nombre de proyecto explícito: evita chocar con Practica_1/api-python, cuya carpeta
# se llama igual y Compose trataría como el mismo proyecto.
name: taskflow-dev

services:
  postgres:
    image: postgres:16
    container_name: taskflow-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow_dev
      POSTGRES_PASSWORD: taskflow_dev
      POSTGRES_DB: taskflow
    ports:
      - "5433:5432"
    volumes:
      - taskflow_pg_dev_data:/var/lib/postgresql/data
      # Mismo esquema que RDS, sin copias.
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_dev -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskflow_pg_dev_data:
