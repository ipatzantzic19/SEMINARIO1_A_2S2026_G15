# SOLO DESARROLLO LOCAL. Este PostgreSQL NO es Amazon RDS.
# Sirve para desarrollar y probar la API Node.js localmente sin depender de RDS.
#
# Uso:
#   docker compose up -d
#
# Automáticamente ejecuta ../database/schema.sql al crear el contenedor por primera vez.

name: taskflow-node-dev

services:
  postgres:
    image: postgres:16
    container_name: taskflow-node-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow_dev
      POSTGRES_PASSWORD: taskflow_dev
      POSTGRES_DB: taskflow
    ports:
      - "5433:5432"
    volumes:
      - taskflow_node_pg_dev_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow_dev -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taskflow_node_pg_dev_data:
